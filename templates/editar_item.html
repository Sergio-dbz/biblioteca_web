{% extends "base.html" %}

{% block title %}Editar Item - Biblioteca App{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">Editando Item: {{ item.titulo }}</div>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" name="titulo" class="form-control" value="{{ item.titulo }}" required>
            </div>
            <div class="form-group">
                <label for="autor">Autor</label>
                <input type="text" name="autor" class="form-control" value="{{ item.autor }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="ano">Ano</label>
                <input type="number" name="ano" class="form-control" value="{{ item.ano or '' }}" min="1000" max="2099">
            </div>
            <div class="form-group">
                <label for="tipo_item">Tipo</label>
                <select name="tipo_item" class="form-control" required>
                    <option value="Livro" {% if item.tipo_item == 'Livro' %}selected{% endif %}>Livro</option>
                    <option value="Periódico" {% if item.tipo_item == 'Periódico' %}selected{% endif %}>Periódico</option>
                    <option value="Mídia Digital" {% if item.tipo_item == 'Mídia Digital' %}selected{% endif %}>Mídia Digital</option>
                    <option value="Outro" {% if item.tipo_item == 'Outro' %}selected{% endif %}>Outro</option>
                </select>
            </div>
             <div class="form-group">
                <label for="status_item">Status</label>
                <select name="status_item" class="form-control" required>
                    <option value="Disponível" {% if item.status_item == 'Disponível' %}selected{% endif %}>Disponível</option>
                    <option value="Emprestado" {% if item.status_item == 'Emprestado' %}selected{% endif %}>Emprestado</option>
                    <option value="Em Manutenção" {% if item.status_item == 'Em Manutenção' %}selected{% endif %}>Em Manutenção</option>
                    <option value="Reservado" {% if item.status_item == 'Reservado' %}selected{% endif %}>Reservado</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <a href="{{ url_for('itens') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
