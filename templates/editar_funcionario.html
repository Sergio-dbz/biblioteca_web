{% extends "base.html" %}

{% block title %}Editar Funcionário - Biblioteca App{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">Editando Funcionário: {{ funcionario.nome }}</div>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" name="nome" class="form-control" value="{{ funcionario.nome }}" required>
            </div>
            <div class="form-group">
                <label for="cargo">Cargo</label>
                <input type="text" name="cargo" class="form-control" value="{{ funcionario.cargo }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" class="form-control" value="{{ funcionario.email }}" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" name="cpf" class="form-control" value="{{ funcionario.CPF }}" required>
            </div>
        </div>
        <div class="form-row">
             <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" name="telefone" class="form-control" value="{{ funcionario.telefone or '' }}">
            </div>
        </div>
        <p style="margin-top: 1rem; color: var(--gray-color);">Obs: A senha não pode ser alterada nesta tela por motivos de segurança.</p>
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{{ url_for('funcionarios') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
